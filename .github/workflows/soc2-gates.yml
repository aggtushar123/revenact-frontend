# SOC 2 security gates (soc2-dev skill). Actions are pinned to commit SHAs
# (SEC-03 supply chain); Dependabot keeps the pins and version comments current. Once branch rules exist on main, make
# every job here a required status check (CHG-01, CHG-02).
#   secret-scan      SEC-01  gitleaks over full history
#   dependency-scan  SEC-03  npm audit against the lockfile
#   static-analysis  SEC-04  semgrep security rulesets (React/TypeScript-aware)
#   soc2-scan        EVD-01  the skill's heuristic scanner + control-map drift
name: soc2-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR's commits

jobs:
  secret-scan:
    name: secret-scan (SEC-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency-scan (SEC-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  static-analysis:
    name: static-analysis (SEC-04)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: >-
          semgrep scan --error --metrics=off
          --config p/security-audit --config p/secrets --config p/owasp-top-ten
          --config p/react --config p/typescript
          --exclude .claude --exclude node_modules --exclude dist --exclude '**/*.test.*'

  soc2-scan:
    name: soc2-heuristic-scan (EVD-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scanner (fails on critical)
        run: |
          python3 .claude/skills/soc2-dev/scripts/soc2_scan.py . --format md --fail-on critical | tee soc2-scan.md
      - name: control map drift
        run: python3 .claude/skills/soc2-dev/scripts/control_map.py . || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: soc2-scan
          path: soc2-scan.md
