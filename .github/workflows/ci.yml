name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'  # same as the Dockerfile (node:22-alpine)
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build project
      run: npm run build

  # Continuous deployment (SOC2:CHG-07): after this repo's tests and the
  # soc2-gates run for the same commit both pass, log into Azure with OpenID
  # Connect (no stored secret) as the deployer identity and run deploy.sh on
  # the VM through Azure's run-command — SSH stays closed to GitHub's runners.
  # deploy.sh pulls main of both repos, so a push to either repo deploys both.
  deploy:
    needs: build_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: production
    steps:
      - name: Wait for soc2-gates on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            c=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=push" \
                 --jq '.workflow_runs[] | select(.name=="soc2-gates") | .conclusion // "pending"' | head -1)
            echo "soc2-gates: ${c:-not started}"
            case "$c" in
              success) exit 0 ;;
              failure|cancelled|timed_out) echo "security gates did not pass; not deploying"; exit 1 ;;
            esac
            sleep 20
          done
          echo "gave up waiting for soc2-gates"; exit 1
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run deploy.sh on the VM
        run: |
          az vm run-command invoke -g revenact-rg -n revenact-vm --command-id RunShellScript \
            --scripts "cd /opt/revenact && DEPLOY_ACTOR='github-actions:${{ github.actor }}:${{ github.repository }}@${{ github.sha }}' ./deploy.sh" \
            --query 'value[0].message' -o tsv | tee deploy-output.txt
          grep -q '^Deployed https://' deploy-output.txt
